name: Build Calvin for Android ARM64 NEON

on:
  push:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:

      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # GraalVM
      # ------------------------------------------------------------
      - name: Set up GraalVM Community JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: '25'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify GraalVM
        run: |
          set -eux

          java -version
          javac -version
          native-image --version

      # ------------------------------------------------------------
      # Android SDK / NDK
      # ------------------------------------------------------------
      - name: Set up Android SDK
        run: |
          set -eux

          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          echo "Using SDK: $SDK_ROOT"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-24" \
            "ndk;27.2.12479018"

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # Android NDK
      # ------------------------------------------------------------
      - name: Configure Android NDK
        run: |
          set -eux

          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"

          test -d "$NDK"

          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

          echo "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Verify Android toolchain
        run: |
          set -eux

          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

          ls -la "$ANDROID_NDK_HOME"

          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" \
            --version

      # ------------------------------------------------------------
      # Verify Calvin NNUE
      # ------------------------------------------------------------
      - name: Verify NNUE
        run: |
          set -eux

          echo "Looking for Calvin NNUE..."

          find . -type f -name 'calvin1024_8b.nnue' -print

          test -f src/main/resources/calvin1024_8b.nnue

          ls -lh src/main/resources/calvin1024_8b.nnue

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------
      - name: Build Calvin native Android ARM64
        id: build-native
        continue-on-error: true
        run: |
          set +e

          echo "=================================================="
          echo " CALVIN NATIVE ANDROID ARM64 BUILD"
          echo "=================================================="

          echo
          echo "===== JAVA ====="
          java -version 2>&1

          echo
          echo "===== NATIVE IMAGE ====="
          native-image --version 2>&1

          echo
          echo "===== MAVEN BUILD ====="

          mvn -B -Pnative -DskipTests clean package -e 2>&1 | tee native-build.log

          STATUS=${PIPESTATUS[0]}

          echo
          echo "===== MAVEN EXIT STATUS: $STATUS ====="

          exit "$STATUS"

      # ------------------------------------------------------------
      # If Native Image fails, preserve the complete log
      # ------------------------------------------------------------
      - name: Upload Native Image error log
        if: steps.build-native.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: Calvin-native-build-log
          path: native-build.log
          if-no-files-found: error
          compression-level: 0

      # ------------------------------------------------------------
      # Stop workflow if Native Image failed
      # ------------------------------------------------------------
      - name: Stop if native build failed
        if: steps.build-native.outcome == 'failure'
        run: |
          echo "Calvin Native Image build failed."
          echo "The complete native-build.log has been uploaded as an artifact."
          exit 1

      # ------------------------------------------------------------
      # Inspect target
      # ------------------------------------------------------------
      - name: Show native build output
        run: |
          set -eux

          echo "Target directory:"
          find target -maxdepth 3 -type f -print

          echo
          echo "Native executables:"
          find target -type f -perm -111 -print || true

      # ------------------------------------------------------------
      # Locate final binary
      # ------------------------------------------------------------
      - name: Locate Calvin binary
        run: |
          set -eux

          BINARY="target/Calvin-android-arm64"

          if [ ! -f "$BINARY" ]; then
            echo "ERROR: Expected native binary was not produced."
            echo
            echo "Target contents:"
            find target -type f -print
            exit 1
          fi

          chmod +x "$BINARY"

          echo "Binary:"
          ls -lh "$BINARY"

          echo
          echo "Binary information:"
          file "$BINARY"

          cp "$BINARY" Calvin-android-arm64

      # ------------------------------------------------------------
      # Upload ONLY the executable
      # ------------------------------------------------------------
      - name: Upload single Calvin ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: Calvin-android-arm64
          path: Calvin-android-arm64
          if-no-files-found: error
          compression-level: 0
