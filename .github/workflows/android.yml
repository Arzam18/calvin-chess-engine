name: Build Calvin for Android ARM64 NEON

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up GraalVM Community JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: '25'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify GraalVM
        run: |
          set -eux

          java -version
          javac -version
          native-image --version

      - name: Set up Android SDK
        run: |
          set -eux

          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          echo "Using Android SDK: $SDK_ROOT"

          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-24" \
            "ndk;27.2.12479018"

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Configure Android NDK
        run: |
          set -eux

          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"

          test -d "$NDK"

          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

          echo "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Verify Android toolchain
        run: |
          set -eux

          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" \
            --version

          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++" \
            --version

      - name: Verify Calvin NNUE
        run: |
          set -eux

          find . -type f -name 'calvin1024_8b.nnue' -print

          test -f src/main/resources/calvin1024_8b.nnue

          ls -lh src/main/resources/calvin1024_8b.nnue

      - name: Build Calvin native Android ARM64
        id: native_build
        continue-on-error: true
        run: |
          set +e

          echo "========================================"
          echo "STARTING NATIVE IMAGE BUILD"
          echo "========================================"

          mvn -B \
            -Pnative \
            -DskipTests \
            clean package \
            -e \
            2>&1 | tee native-build.log

          BUILD_STATUS=${PIPESTATUS[0]}

          echo
          echo "Maven exit code: $BUILD_STATUS"

          exit "$BUILD_STATUS"

      - name: Extract actual Native Image error
        if: always()
        run: |
          set +e

          echo
          echo "============================================================"
          echo "IMPORTANT NATIVE IMAGE ERROR"
          echo "============================================================"

          if [ -f native-build.log ]; then

            echo
            echo "----- Matching error lines -----"

            grep -n -E \
              'ClassCastException|ForeignFunctionsFeature|Caused by:|Fatal:|Error:|UnsupportedFeatureException|UserError|VMError|Exception' \
              native-build.log | tail -100 || true

            echo
            echo "----- Context around ClassCastException -----"

            grep -n -B 20 -A 60 \
              'ClassCastException' \
              native-build.log | tail -150 || true

            echo
            echo "----- Context around ForeignFunctionsFeature -----"

            grep -n -B 20 -A 60 \
              'ForeignFunctionsFeature' \
              native-build.log | tail -150 || true

            echo
            echo "----- Last 200 lines of build -----"

            tail -200 native-build.log

          else
            echo "ERROR: native-build.log was not created."
          fi

      - name: Inspect Native Image diagnostic files
        if: always()
        run: |
          set +e

          echo
          echo "============================================================"
          echo "SVM DIAGNOSTIC FILES"
          echo "============================================================"

          find . -type f -name 'svm_err_*.md' -print

          for FILE in $(find . -type f -name 'svm_err_*.md'); do

            echo
            echo "============================================================"
            echo "DIAGNOSTIC: $FILE"
            echo "============================================================"

            echo
            echo "----- Important lines -----"

            grep -n -E \
              'ClassCastException|ForeignFunctionsFeature|Caused by:|Fatal:|Error:|UnsupportedFeatureException|UserError|VMError|Exception' \
              "$FILE" | head -150 || true

            echo
            echo "----- Last 150 lines -----"

            tail -150 "$FILE"

          done

      - name: Show target output
        if: always()
        run: |
          set +e

          echo
          echo "============================================================"
          echo "TARGET CONTENTS"
          echo "============================================================"

          find target -maxdepth 3 -type f -print 2>/dev/null || true

      - name: Check native binary
        run: |
          set -eux

          if [ ! -f "target/Calvin-android-arm64" ]; then
            echo "ERROR: Calvin native binary was not produced."
            exit 1
          fi

          chmod +x target/Calvin-android-arm64

          echo "Binary:"
          ls -lh target/Calvin-android-arm64

          echo
          file target/Calvin-android-arm64

      - name: Prepare single binary artifact
        if: success()
        run: |
          set -eux

          cp target/Calvin-android-arm64 Calvin-android-arm64

          chmod +x Calvin-android-arm64

          ls -lh Calvin-android-arm64

          file Calvin-android-arm64

      - name: Upload single Calvin ARM64 binary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Calvin-android-arm64
          path: Calvin-android-arm64
          if-no-files-found: error
          compression-level: 0
