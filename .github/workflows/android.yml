name: Build Calvin for Android ARM64 NEON

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up GraalVM Community JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: '25'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify GraalVM
        run: |
          set -eux

          java -version
          javac -version
          native-image --version

      - name: Set up Android SDK
        run: |
          set -eux

          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          echo "Using Android SDK: $SDK_ROOT"
          echo "Using sdkmanager: $SDKMANAGER"

          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-24" \
            "ndk;27.2.12479018"

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Configure Android NDK
        run: |
          set -eux

          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"

          test -d "$NDK"

          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

          echo "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Verify Android toolchain
        run: |
          set -eux

          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

          ls -la "$ANDROID_NDK_HOME"

          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" \
            --version

          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++" \
            --version

      - name: Verify Calvin NNUE
        run: |
          set -eux

          echo "Looking for Calvin NNUE..."

          find . -type f -name 'calvin1024_8b.nnue' -print

          test -f src/main/resources/calvin1024_8b.nnue

          ls -lh src/main/resources/calvin1024_8b.nnue

      - name: Build Calvin native Android ARM64
        id: native_build
        continue-on-error: true
        run: |
          set -eux

          mvn -B \
            -Pnative \
            -DskipTests \
            clean package \
            -e

      - name: Extract Native Image diagnostic
        if: always()
        run: |
          set +e

          echo
          echo "========================================"
          echo "NATIVE IMAGE DIAGNOSTIC FILES"
          echo "========================================"

          find target -type f -name 'svm_err_*.md' -print

          FOUND=0

          for FILE in target/svm_err_*.md; do
            if [ -f "$FILE" ]; then
              FOUND=1

              echo
              echo "========================================"
              echo "FILE: $FILE"
              echo "========================================"

              echo
              echo "========================================"
              echo "ERROR / EXCEPTION LINES"
              echo "========================================"

              grep -n -E \
                'Error:|Fatal:|Caused by:|ClassCastException|UnsupportedFeatureException|UserError|ForeignFunctionsFeature|Exception|Stack trace' \
                "$FILE" | head -250 || true

              echo
              echo "========================================"
              echo "LAST 150 LINES"
              echo "========================================"

              tail -150 "$FILE"
            fi
          done

          if [ "$FOUND" -eq 0 ]; then
            echo
            echo "No svm_err diagnostic file was found."
            echo
            echo "Searching entire target directory:"
            find target -type f -print 2>/dev/null || true
          fi

      - name: Show native build output
        if: always()
        run: |
          set +e

          echo "========================================"
          echo "TARGET DIRECTORY"
          echo "========================================"

          find target -maxdepth 3 -type f -print 2>/dev/null || true

          echo
          echo "========================================"
          echo "NATIVE EXECUTABLES"
          echo "========================================"

          find target -type f -perm -111 -print 2>/dev/null || true

      - name: Check native build result
        run: |
          set -eux

          if [ ! -f "target/Calvin-android-arm64" ]; then
            echo "ERROR: Calvin native binary was not produced."
            echo
            echo "The diagnostic output above contains the Native Image error."
            exit 1
          fi

          chmod +x target/Calvin-android-arm64

          echo "Native binary:"
          ls -lh target/Calvin-android-arm64

          echo
          echo "Binary information:"
          file target/Calvin-android-arm64

      - name: Copy single Calvin binary
        if: success()
        run: |
          set -eux

          cp target/Calvin-android-arm64 Calvin-android-arm64

          chmod +x Calvin-android-arm64

          ls -lh Calvin-android-arm64

          file Calvin-android-arm64

      - name: Upload single Calvin ARM64 binary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Calvin-android-arm64
          path: Calvin-android-arm64
          if-no-files-found: error
          compression-level: 0
