name: Build Calvin for Android ARM64 NEON

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Android SDK
        run: |
          set -eux

          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-24" \
            "ndk;27.2.12479018"

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Verify Android toolchain
        run: |
          set -eux

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          adb version || true

          test -d "$ANDROID_SDK_ROOT/ndk/27.2.12479018"

          ls -la "$ANDROID_SDK_ROOT/ndk/27.2.12479018"

      - name: Set Android NDK environment
        run: |
          set -eux

          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"

          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

          echo "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Verify Calvin NNUE
        run: |
          set -eux

          echo "Searching for Calvin NNUE..."

          find . -type f \
            \( -name 'calvin1024_8b.nnue' -o -name '*.nnue' \) \
            -print

          test -f calvin1024_8b.nnue || \
            test -f src/main/resources/calvin1024_8b.nnue || \
            test -f src/main/resources/networks/calvin1024_8b.nnue

      - name: Show Java version
        run: |
          java -version
          javac -version

      - name: Show Maven version
        run: |
          mvn -version

      - name: Build Calvin native Android ARM64
        env:
          GRAALVM_HOME: ${{ env.JAVA_HOME }}
        run: |
          set -eux

          mvn -B -DskipTests package

      - name: Locate native executable
        run: |
          set -eux

          echo "Searching for native Calvin executable..."

          find . -type f -perm -111 -print || true

          find target -maxdepth 3 -type f -print || true

      - name: Verify executable
        run: |
          set -eux

          BINARY=""

          for candidate in \
            target/calvin \
            target/calvin-* \
            target/*/calvin \
            target/*/calvin-* \
            target/native-image/calvin \
            target/native-image/calvin-*; do

            if [ -f "$candidate" ] && [ -x "$candidate" ]; then
              BINARY="$candidate"
              break
            fi

          done

          if [ -z "$BINARY" ]; then
            echo "ERROR: Native Calvin executable was not found."
            echo
            echo "Contents of target:"
            find target -type f -print || true
            exit 1
          fi

          echo "Native executable:"
          echo "$BINARY"

          file "$BINARY"

          chmod +x "$BINARY"

          echo
          echo "Binary size:"
          ls -lh "$BINARY"

          echo
          echo "Binary information:"
          file "$BINARY"

          cp "$BINARY" Calvin-android-arm64

      - name: Test UCI executable
        run: |
          set -eux

          chmod +x Calvin-android-arm64

          echo "Running native executable test..."

          printf 'uci\nisready\nquit\n' |
            timeout 30 ./Calvin-android-arm64 || true

      - name: Upload Calvin Android ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: Calvin-android-arm64
          path: Calvin-android-arm64
          if-no-files-found: error
          compression-level: 0
